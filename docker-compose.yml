version: '3.8'

services:
  # PostgreSQL 数据库（数据层）
  postgres:
    image: postgres:15-alpine
    container_name: quantflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantflow}
      POSTGRES_USER: ${POSTGRES_USER:-quantflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - data_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantflow_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 安全配置：不暴露到公网
    # ports:
    #   - "5432:5432"  # 仅在开发环境取消注释

  # Redis 缓存（数据层）
  redis:
    image: redis:7-alpine
    container_name: quantflow-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_this_redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - data_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 安全配置：不暴露到公网
    # ports:
    #   - "6379:6379"  # 仅在开发环境取消注释

  # FastAPI 应用（应用层）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantflow-app
    environment:
      # 数据库配置
      DATABASE_URL: postgresql://${POSTGRES_USER:-quantflow_user}:${POSTGRES_PASSWORD:-change_this_password}@postgres:5432/${POSTGRES_DB:-quantflow}
      
      # Redis 配置
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_this_redis_password}@redis:6379/0
      
      # 安全配置
      SECRET_KEY: ${SECRET_KEY:-change_this_secret_key_to_random_string}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_jwt_secret_key}
      JWT_ALGORITHM: RS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      
      # 加密配置
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change_this_encryption_key_32_bytes}
      
      # CORS 配置
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,https://yourdomain.com}
      
      # AI 模型配置
      STEPFUN_API_KEY: ${STEPFUN_API_KEY}
      KIMI_API_KEY: ${KIMI_API_KEY}
      
      # 外部 API 配置
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      
      # 应用配置
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
    volumes:
      - ./backend/data:/app/backend/data:ro  # 只读挂载数据文件
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
      - data_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 安全配置：不直接暴露到公网，通过 Nginx 代理
    # ports:
    #   - "8000:8000"  # 仅在开发环境取消注释

  # Nginx 反向代理（公网层）
  nginx:
    image: nginx:alpine
    container_name: quantflow-nginx
    ports:
      - "80:80"      # HTTP（将重定向到 HTTPS）
      - "443:443"    # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  # 公网层网络（仅 Nginx）
  app_network:
    driver: bridge
  
  # 数据层网络（应用和数据库）
  data_network:
    driver: bridge
    internal: true  # 内部网络，不可访问外网

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
